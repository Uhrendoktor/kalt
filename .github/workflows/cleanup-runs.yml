name: cleanup-runs

on:
  push:
    branches: [dev0.1.1-test-infra]
  pull_request:
    types: [synchronize]

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete all workflow runs and this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate /repos/${GITHUB_REPOSITORY}/actions/runs --jq '.workflow_runs[].id' | sort -u | while read -r id; do
            [ "$id" = "$GITHUB_RUN_ID" ] || gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/$id"
          done
          git rm .github/workflows/cleanup-runs.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Remove temporary workflow [skip ci]'
          git push
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/$GITHUB_RUN_ID"
