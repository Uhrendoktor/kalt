name: canonical-execution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalt-typst-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typst-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.sha }}
      - uses: actions/checkout@v7
        with:
          repository: Uhrendoktor/sertyp
          ref: dev0.1.6
          path: sertyp
      - name: Prepare and build bindings
        run: |
          ln -s "$GITHUB_WORKSPACE/sertyp" "$GITHUB_WORKSPACE/../sertyp"
          ls -a
          pwd
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown -p kalt_bindings
          cp target/wasm32-unknown-unknown/release/bindings.wasm typst/bindings.wasm
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Run tests
        run: |
          typst compile --root . --input ci=true typst/tests/test.typ /tmp/kalt-tests.pdf
          typst eval --root . --input ci=true 'query(<kalt-test-report>).first().value' --in typst/tests/test.typ > /tmp/kalt-test-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/kalt-test-report.json').read_text())
          print(f"KALT TESTS: {report['passed']}/{report['total']} passed, {report['failed']} failed")
          for result in report['results']:
              print(f"{'PASS' if result['passed'] else 'FAIL'}: {result['name']}")
          if report['total'] == 0:
              raise SystemExit('no tests were executed')
          if report['failed']:
              raise SystemExit(1)
          PY
      - name: Render titleless Typst README outputs
        run: bash typst/docs/render-examples.sh
      - name: Commit generated README previews
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f typst/assets/readme/*.svg
          if git diff --cached --quiet; then
            echo "Generated Typst previews are up to date."
            exit 0
          fi
          git commit -m "Regenerate Typst README SVGs"
          git push origin "HEAD:$TARGET_BRANCH"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kalt-readme-examples
          path: typst/assets/readme/*.svg
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kalt-test-report
          path: /tmp/kalt-test-report.json
