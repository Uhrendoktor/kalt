name: canonical-execution

on:
  push:
    branches: [dev0.1.1-test-infra]
  pull_request:
  workflow_dispatch:

jobs:
  typst-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kalt
        uses: actions/checkout@v4

      - name: Checkout sertyp dependency
        uses: actions/checkout@v4
        with:
          repository: Uhrendoktor/sertyp
          ref: dev0.1.6
          path: sertyp

      - name: Expose sertyp at Cargo's expected sibling path
        run: ln -s "$GITHUB_WORKSPACE/sertyp" "$GITHUB_WORKSPACE/../sertyp"

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build Typst bindings
        run: |
          cargo build --release --target wasm32-unknown-unknown -p kalt_bindings
          cp target/wasm32-unknown-unknown/release/bindings.wasm typst/bindings.wasm

      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: 0.15.1

      - name: Install local sertyp Typst package
        run: |
          mkdir -p "$HOME/.local/share/typst/packages/local/sertyp/0.1.6"
          cp -R sertyp/typst/. "$HOME/.local/share/typst/packages/local/sertyp/0.1.6/"

      - name: Compile machine-readable test suite
        run: typst compile --root . --input ci=true typst/tests/ci.typ /tmp/kalt-tests.pdf

      - name: Read test report
        run: |
          typst eval --root . --input ci=true 'query(<kalt-test-report>).first().value' --in typst/tests/ci.typ > /tmp/kalt-test-report.json
          cat /tmp/kalt-test-report.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalt-test-report
          path: /tmp/kalt-test-report.json
          if-no-files-found: ignore

      - name: Evaluate test report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/kalt-test-report.json').read_text())
          print(f"KALT TESTS: {report['passed']}/{report['total']} passed, {report['failed']} failed")
          for result in report['results']:
              print(f"{'PASS' if result['passed'] else 'FAIL'}: {result['name']}")
              if not result['passed']:
                  for key in ('debug-output-type', 'debug-expected-type', 'debug-output', 'debug-expected'):
                      if result.get(key) is not None:
                          print(f"  {key}: {result[key]}")

          if report['total'] == 0:
              raise SystemExit('no tests were executed')
          if report['failed']:
              raise SystemExit(1)
          PY
